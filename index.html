<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesan Menu - R.M. Akekap</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { akekapRed: '#cc0000', akekapBlack: '#1a1a1a' }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 font-sans pb-24">

    <!-- Header -->
    <header class="bg-akekapBlack text-white p-4 sticky top-0 z-40 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold text-akekapRed">R.M. Akekap</h1>
            <p class="text-sm italic text-gray-300">Anda Kenyang Kami Pus</p>
        </div>
    </header>

    <!-- Konten Menu -->
    <main class="container mx-auto p-4 mt-2">
        <h2 class="text-xl font-bold mb-4 text-akekapBlack border-b-2 border-akekapRed pb-2 inline-block">Menu Fusion</h2>
        <div id="menu-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <!-- Floating Cart Button -->
    <div class="fixed bottom-0 left-0 w-full bg-white shadow-[0_-4px_10px_-1px_rgba(0,0,0,0.1)] p-4 rounded-t-2xl z-40">
        <div class="container mx-auto flex justify-between items-center">
            <div>
                <p class="text-xs text-gray-500 font-bold uppercase">Total Pesanan</p>
                <p class="text-xl font-bold text-akekapRed" id="cart-total-text">Rp 0</p>
            </div>
            <button onclick="toggleModal('checkout-modal')" class="bg-akekapRed text-white px-6 py-2 rounded-full font-bold hover:bg-red-800 transition shadow-lg flex items-center gap-2">
                Checkout (<span id="cart-count">0</span>)
            </button>
        </div>
    </div>

    <!-- Modal Checkout -->
    <div id="checkout-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex justify-center items-end md:items-center">
        <div class="bg-white w-full md:w-1/2 lg:w-1/3 rounded-t-2xl md:rounded-2xl p-6 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold">Detail Pesanan</h2>
                <button onclick="toggleModal('checkout-modal')" class="text-gray-500 font-bold text-xl">&times;</button>
            </div>
            
            <!-- List Keranjang -->
            <div id="cart-items" class="mb-4 divide-y border-b pb-4"></div>

            <!-- Form Pemesanan -->
            <form id="order-form" onsubmit="prosesCheckout(event)">
                <div class="mb-3">
                    <label class="block text-sm font-bold mb-1">Nama Pemesan</label>
                    <input type="text" id="customer_name" required class="w-full border rounded p-2" placeholder="Nama Anda">
                </div>
                <div class="mb-3">
                    <label class="block text-sm font-bold mb-1">Tipe Pesanan</label>
                    <select id="order_type" onchange="toggleTableInput()" required class="w-full border rounded p-2">
                        <option value="Dine-in">Dine-in (Makan di tempat)</option>
                        <option value="Takeaway">Takeaway (Bungkus)</option>
                    </select>
                </div>
                <div class="mb-5" id="table_input_container">
                    <label class="block text-sm font-bold mb-1">Nomor Meja</label>
                    <input type="number" id="table_number" class="w-full border rounded p-2" placeholder="Contoh: 5">
                </div>
                
                <button type="submit" id="btn-submit" class="w-full bg-akekapBlack text-white font-bold py-3 rounded-xl hover:bg-gray-800 transition">
                    Pesan & Lanjut ke WA
                </button>
            </form>
        </div>
    </div>

    <!-- LOGIKA JAVASCRIPT -->
    <script>
        // ==========================================
        // 1. KONFIGURASI SUPABASE & WA
        // ==========================================
        const SUPABASE_URL = 'https://kncxuoxrygbswwpwmvrl.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_H5E0sFqIQvUg-Mf_DPApMQ_93FwUQk0'; 
        const NOMOR_WHATSAPP = '6285342101366'; 

        // PERBAIKAN: Mengubah nama variabel agar tidak bertabrakan dengan sistem
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ==========================================
        // 2. DATA MENU R.M. AKEKAP
        // ==========================================
        const menus = [
            { id: 1, name: "Dimsum Cakalang", price: 25000, image: "https://placehold.co/400x300/1a1a1a/ffffff?text=Dimsum+Cakalang" },
            { id: 2, name: "Steak Saus Cengkeh", price: 85000, image: "https://placehold.co/400x300/1a1a1a/ffffff?text=Steak+Saus+Cengkeh" },
            { id: 3, name: "Waffle Nasi Jaha", price: 30000, image: "https://placehold.co/400x300/1a1a1a/ffffff?text=Waffle+Nasi+Jaha" },
            { id: 4, name: "Bingsu Gohu Pepaya", price: 28000, image: "https://placehold.co/400x300/1a1a1a/ffffff?text=Bingsu+Gohu+Pepaya" },
            { id: 5, name: "Kombucha Buah Pala", price: 20000, image: "https://placehold.co/400x300/1a1a1a/ffffff?text=Kombucha+Buah+Pala" }
        ];

        let cart = []; 

        // ==========================================
        // 3. FUNGSI UI & KERANJANG
        // ==========================================
        function renderMenus() {
            const container = document.getElementById('menu-container');
            container.innerHTML = menus.map(menu => `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                    <img src="${menu.image}" class="w-full h-48 object-cover">
                    <div class="p-4">
                        <h3 class="font-bold text-lg">${menu.name}</h3>
                        <p class="text-akekapRed font-bold mt-1">Rp ${menu.price.toLocaleString('id-ID')}</p>
                        <button onclick="addToCart(${menu.id})" class="mt-4 w-full bg-akekapBlack text-white py-2.5 rounded-xl font-semibold hover:bg-gray-800">
                            + Tambah
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(menuId) {
            const menu = menus.find(m => m.id === menuId);
            const existingItem = cart.find(item => item.id === menuId);
            
            if (existingItem) {
                existingItem.qty += 1;
            } else {
                cart.push({ ...menu, qty: 1 });
            }
            updateCartUI();
        }

        function updateCartUI() {
            const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            
            document.getElementById('cart-count').innerText = totalQty;
            document.getElementById('cart-total-text').innerText = 'Rp ' + totalPrice.toLocaleString('id-ID');

            const cartItemsContainer = document.getElementById('cart-items');
            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<p class="text-gray-500 text-center py-4">Keranjang masih kosong</p>';
                document.getElementById('btn-submit').disabled = true;
                document.getElementById('btn-submit').classList.add('opacity-50');
            } else {
                document.getElementById('btn-submit').disabled = false;
                document.getElementById('btn-submit').classList.remove('opacity-50');
                cartItemsContainer.innerHTML = cart.map((item) => `
                    <div class="flex justify-between items-center py-2">
                        <div>
                            <p class="font-bold">${item.name}</p>
                            <p class="text-sm text-gray-500">${item.qty} x Rp ${item.price.toLocaleString('id-ID')}</p>
                        </div>
                        <p class="font-bold">Rp ${(item.price * item.qty).toLocaleString('id-ID')}</p>
                    </div>
                `).join('');
            }
        }

        function toggleModal(modalId) {
            document.getElementById(modalId).classList.toggle('hidden');
        }

        function toggleTableInput() {
            const type = document.getElementById('order_type').value;
            const tableContainer = document.getElementById('table_input_container');
            if (type === 'Takeaway') {
                tableContainer.classList.add('hidden');
            } else {
                tableContainer.classList.remove('hidden');
            }
        }

        // ==========================================
        // 4. PROSES CHECKOUT KE SUPABASE & WA
        // ==========================================
        async function prosesCheckout(event) {
            event.preventDefault(); 
            
            if (cart.length === 0) return alert("Keranjang kosong!");

            const btnSubmit = document.getElementById('btn-submit');
            btnSubmit.innerText = "Memproses...";
            btnSubmit.disabled = true;

            const name = document.getElementById('customer_name').value;
            const type = document.getElementById('order_type').value;
            const table = document.getElementById('table_number').value || "-";
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            // PERBAIKAN: Menggunakan supabaseClient
            const { data, error } = await supabaseClient
                .from('orders')
                .insert([
                    { 
                        customer_name: name, 
                        order_type: type, 
                        table_number: table, 
                        order_details: cart, 
                        total_price: totalPrice 
                    }
                ]);

            if (error) {
                alert("Gagal menyimpan pesanan: " + error.message);
                btnSubmit.innerText = "Pesan & Lanjut ke WA";
                btnSubmit.disabled = false;
                return;
            }

            // 2. Format Pesan WhatsApp
            let textWA = `Halo R.M. Akekap!%0A`;
            textWA += `Saya ingin memesan makanan.%0A%0A`;
            textWA += `*Nama:* ${name}%0A`;
            textWA += `*Tipe:* ${type}%0A`;
            if(type === 'Dine-in') textWA += `*Meja:* ${table}%0A`;
            textWA += `%0A*Pesanan:*%0A`;
            
            cart.forEach(item => {
                textWA += `- ${item.name} (${item.qty}x) = Rp ${(item.price * item.qty).toLocaleString('id-ID')}%0A`;
            });
            
            textWA += `%0A*Total: Rp ${totalPrice.toLocaleString('id-ID')}*%0A%0A`;
            textWA += `_Anda Kenyang Kami Pus_`;

            // 3. Reset UI dan arahkan ke WA
            cart = [];
            updateCartUI();
            toggleModal('checkout-modal');
            btnSubmit.innerText = "Pesan & Lanjut ke WA";
            btnSubmit.disabled = false;

            window.open(`https://wa.me/${NOMOR_WHATSAPP}?text=${textWA}`, '_blank');
        }

        // Jalankan saat pertama kali dibuka
        renderMenus();
        updateCartUI();
    </script>
</body>
</html>
