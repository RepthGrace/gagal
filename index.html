<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R.M. Akekap - Anda Kenyang Kami Puas</title>
    
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome untuk Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: { akekapRed: '#cc0000', akekapBlack: '#0f0f0f', akekapDark: '#181818' }
                }
            }
        }
    </script>
    <style>
        /* Background Kustom dengan Pola Gradasi Elegan */
        body {
            background-color: #0f0f0f;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(204, 0, 0, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(139, 0, 0, 0.06) 0%, transparent 40%);
            background-attachment: fixed;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .toast-animate { animation: slideUp 0.3s ease-out forwards; }
    </style>
</head>
<body class="font-sans pb-32 text-gray-100 selection:bg-akekapRed selection:text-white">

    <!-- ================= HEADER & HERO SECTION ================= -->
    <header class="bg-akekapBlack/90 backdrop-blur-md sticky top-0 z-40 shadow-2xl border-b border-gray-800/60 rounded-b-3xl">
        <div class="px-5 py-4 flex justify-between items-center max-w-7xl mx-auto">
            <!-- Menampilkan Logo SVG R.M. Akekap -->
            <div class="flex items-center gap-3">
                <img src="logo umkm vector.svg" alt="Logo R.M. Akekap" class="h-14 md:h-16 w-auto drop-shadow-[0_5px_15px_rgba(204,0,0,0.3)]">
                <div class="hidden sm:block">
                    <p class="text-[10px] text-gray-400 font-medium tracking-widest uppercase mt-1">Anda Kenyang Kami Puas</p>
                </div>
            </div>
            
            <div class="bg-akekapDark p-3 rounded-full border border-gray-700/60 shadow-inner">
                <i class="fa-solid fa-utensils text-akekapRed"></i>
            </div>
        </div>
        
        <!-- Search Bar -->
        <div class="px-5 pb-5 max-w-7xl mx-auto">
            <div class="relative mt-1">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <i class="fa-solid fa-magnifying-glass text-gray-400"></i>
                </div>
                <input type="text" id="search-input" onkeyup="filterMenu()" 
                       class="w-full pl-11 pr-4 py-3 bg-gray-900/80 border border-gray-800 text-white rounded-2xl focus:outline-none focus:border-akekapRed focus:ring-1 focus:ring-akekapRed transition placeholder-gray-500 shadow-inner" 
                       placeholder="Mau makan apa hari ini?">
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto mt-6">
        <!-- ================= KATEGORI FILTER ================= -->
        <div class="px-5 mb-6">
            <div class="flex space-x-3 overflow-x-auto no-scrollbar py-1" id="category-container">
                <button onclick="setCategory('Semua', this)" class="cat-btn whitespace-nowrap px-5 py-2 rounded-full font-semibold text-sm bg-akekapRed text-white shadow-lg shadow-red-900/30 transition">Semua</button>
                <button onclick="setCategory('Makanan', this)" class="cat-btn whitespace-nowrap px-5 py-2 rounded-full font-semibold text-sm bg-gray-900 text-gray-300 border border-gray-800 hover:bg-gray-800 transition">Makanan</button>
                <button onclick="setCategory('Minuman', this)" class="cat-btn whitespace-nowrap px-5 py-2 rounded-full font-semibold text-sm bg-gray-900 text-gray-300 border border-gray-800 hover:bg-gray-800 transition">Minuman</button>
                <button onclick="setCategory('Dessert', this)" class="cat-btn whitespace-nowrap px-5 py-2 rounded-full font-semibold text-sm bg-gray-900 text-gray-300 border border-gray-800 hover:bg-gray-800 transition">Dessert</button>
            </div>
        </div>

        <!-- ================= DAFTAR MENU ================= -->
        <div class="px-5">
            <div id="menu-container" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6">
                <!-- Kartu Menu akan digenerate oleh JS -->
            </div>
            <!-- Pesan jika pencarian tidak ditemukan -->
            <div id="empty-state" class="hidden text-center py-12">
                <i class="fa-solid fa-face-frown text-4xl text-gray-600 mb-3"></i>
                <p class="text-gray-400 font-medium">Menu tidak ditemukan.</p>
            </div>
        </div>
    </main>

    <!-- ================= FLOATING CART BOTTOM BAR ================= -->
    <div class="fixed bottom-0 left-0 w-full z-40 p-4 pointer-events-none">
        <div class="max-w-7xl mx-auto pointer-events-auto bg-akekapDark/95 backdrop-blur-md rounded-3xl shadow-2xl p-2.5 flex items-center justify-between border border-gray-800">
            <div class="flex items-center gap-3 pl-4">
                <div class="relative bg-akekapBlack p-2.5 rounded-2xl border border-gray-800">
                    <i class="fa-solid fa-basket-shopping text-white text-lg"></i>
                    <span id="cart-count-badge" class="absolute -top-2 -right-2 bg-akekapRed text-white text-[10px] font-bold px-2 py-0.5 rounded-full border-2 border-akekapDark hidden shadow-md">0</span>
                </div>
                <div>
                    <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Total Tagihan</p>
                    <p class="text-base md:text-lg font-bold text-white leading-none" id="cart-total-text">Rp 0</p>
                </div>
            </div>
            <button onclick="toggleModal('checkout-modal')" class="bg-akekapRed hover:bg-red-700 text-white px-6 py-3 rounded-2xl font-bold transition shadow-lg shadow-red-900/30 flex items-center gap-2">
                Checkout <i class="fa-solid fa-chevron-right text-xs"></i>
            </button>
        </div>
    </div>

    <!-- ================= MODAL CHECKOUT ================= -->
    <div id="checkout-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex justify-center items-end md:items-center opacity-0 transition-opacity duration-300">
        <div class="bg-akekapDark text-gray-100 w-full md:w-[500px] rounded-t-3xl md:rounded-3xl flex flex-col max-h-[90vh] shadow-2xl border border-gray-800 transform translate-y-full md:translate-y-0 transition-transform duration-300" id="checkout-content">
            
            <!-- Header Modal -->
            <div class="p-5 border-b border-gray-800 flex justify-between items-center sticky top-0 bg-akekapDark rounded-t-3xl z-10">
                <h2 class="text-xl font-extrabold text-white">Detail Pesanan</h2>
                <button onclick="toggleModal('checkout-modal')" class="bg-gray-800 hover:bg-gray-700 text-gray-300 w-8 h-8 rounded-full flex items-center justify-center transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <!-- Area Scroll Modal -->
            <div class="overflow-y-auto p-5 pb-24">
                <div id="cart-items" class="mb-6 space-y-3">
                    <!-- Item keranjang -->
                </div>

                <div class="border-t border-gray-800 pt-5">
                    <h3 class="font-bold text-gray-200 mb-4 flex items-center gap-2">
                        <i class="fa-regular fa-id-card text-akekapRed"></i> Informasi Pelanggan
                    </h3>
                    <form id="order-form" onsubmit="prosesCheckout(event)">
                        <div class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Nama Pemesan</label>
                                <input type="text" id="customer_name" required class="w-full bg-gray-900 border border-gray-800 text-white rounded-xl p-3 focus:outline-none focus:border-akekapRed focus:ring-1 focus:ring-akekapRed transition" placeholder="Masukkan nama Anda">
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Tipe Pesanan</label>
                                    <select id="order_type" onchange="toggleTableInput()" required class="w-full bg-gray-900 border border-gray-800 text-white rounded-xl p-3 focus:outline-none focus:border-akekapRed appearance-none">
                                        <option value="Dine-in">Dine-in</option>
                                        <option value="Takeaway">Takeaway</option>
                                    </select>
                                </div>
                                <div id="table_input_container">
                                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">No. Meja</label>
                                    <input type="number" id="table_number" class="w-full bg-gray-900 border border-gray-800 text-white rounded-xl p-3 focus:outline-none focus:border-akekapRed" placeholder="Cth: 5">
                                </div>
                            </div>
                        </div>
                        
                        <div class="mt-8">
                            <button type="submit" id="btn-submit" class="w-full bg-akekapRed hover:bg-red-700 text-white font-bold py-4 rounded-2xl transition flex justify-center items-center gap-2 shadow-lg shadow-red-900/30">
                                <i class="fa-brands fa-whatsapp text-xl text-white"></i> Pesan & Lanjut WA
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- ================= TOAST NOTIFICATION CONTAINER ================= -->
    <div id="toast-container" class="fixed top-5 left-1/2 transform -translate-x-1/2 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- ================= LOGIKA JAVASCRIPT ================= -->
    <script>
        // KREDENSIAL SUPABASE
        const SUPABASE_URL = 'https://kncxuoxrygbswwpwmvrl.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_H5E0sFqIQvUg-Mf_DPApMQ_93FwUQk0'; 
        const NOMOR_WHATSAPP = '6285342101366'; 

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // DATA MENU (Disinkronkan dengan Baliho R.M Akekap)
        const menus = [
            { id: 1, name: "Dimsum Cakalang", category: "Makanan", price: 45000, isPopular: true, image: "https://placehold.co/400x400/181818/ffffff?text=Dimsum+Cakalang" },
            { id: 2, name: "Steak Saus Cengkeh", category: "Makanan", price: 45000, isPopular: true, image: "https://placehold.co/400x400/181818/ffffff?text=Steak+Saus+Cengkeh" },
            { id: 3, name: "Waffle Nasi Jaha", category: "Makanan", price: 45000, isPopular: false, image: "https://placehold.co/400x400/181818/ffffff?text=Waffle+Nasi+Jaha" },
            { id: 4, name: "Nachos Pampis Cakalang", category: "Makanan", price: 45000, isPopular: false, image: "https://placehold.co/400x400/181818/ffffff?text=Nachos+Pampis" },
            { id: 5, name: "Brisket Asap Bumbu Woku", category: "Makanan", price: 45000, isPopular: true, image: "https://placehold.co/400x400/181818/ffffff?text=Brisket+Woku" },
            { id: 6, name: "Spaghetti Garo Rica", category: "Makanan", price: 55000, isPopular: false, image: "https://placehold.co/400x400/181818/ffffff?text=Spaghetti+Rica" },
            { id: 7, name: "Kebab Daging Rica Lemon Cui", category: "Makanan", price: 65000, isPopular: false, image: "https://placehold.co/400x400/181818/ffffff?text=Kebab+Rica" },
            { id: 8, name: "Burger Roa", category: "Makanan", price: 65000, isPopular: true, image: "https://placehold.co/400x400/181818/ffffff?text=Burger+Roa" },
            { id: 9, name: "Quiche Sayur Pangi", category: "Makanan", price: 45000, isPopular: false, image: "https://placehold.co/400x400/181818/ffffff?text=Quiche+Pangi" },
            { id: 10, name: "Nasi Campur Nanas", category: "Makanan", price: 45000, isPopular: false, image: "https://placehold.co/400x400/181818/ffffff?text=Nasi+Nanas" },
            { id: 11, name: "Kombucha Buah Pala", category: "Minuman", price: 35000, isPopular: true, image: "https://placehold.co/400x400/181818/ffffff?text=Kombucha+Pala" },
            { id: 12, name: "Kombucha Buah Matoa", category: "Minuman", price: 45000, isPopular: false, image: "https://placehold.co/400x400/181818/ffffff?text=Kombucha+Matoa" },
            { id: 13, name: "Golden Woku Latte", category: "Minuman", price: 35000, isPopular: true, image: "https://placehold.co/400x400/181818/ffffff?text=Woku+Latte" },
            { id: 14, name: "Es Churros Kenari", category: "Dessert", price: 36000, isPopular: true, image: "https://placehold.co/400x400/181818/ffffff?text=Churros+Kenari" },
            { id: 15, name: "Bingsu Gohu Pepaya", category: "Dessert", price: 26000, isPopular: false, image: "https://placehold.co/400x400/181818/ffffff?text=Bingsu+Gohu" }
        ];

        let cart = []; 
        let activeCategory = 'Semua';

        function renderMenus(searchQuery = '') {
            const container = document.getElementById('menu-container');
            const emptyState = document.getElementById('empty-state');
            
            const filteredMenus = menus.filter(menu => {
                const matchCategory = activeCategory === 'Semua' || menu.category === activeCategory;
                const matchSearch = menu.name.toLowerCase().includes(searchQuery.toLowerCase());
                return matchCategory && matchSearch;
            });

            if (filteredMenus.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            container.innerHTML = filteredMenus.map(menu => {
                const badge = menu.isPopular ? `<div class="absolute top-2 right-2 bg-akekapRed text-white text-[10px] font-bold px-2.5 py-1 rounded-lg shadow-md z-10"><i class="fa-solid fa-star mr-1"></i> Favorit</div>` : '';
                
                return `
                <div class="bg-akekapDark rounded-2xl shadow-lg border border-gray-800/80 overflow-hidden hover:border-akekapRed/50 transition-all duration-300 relative group flex flex-col h-full">
                    ${badge}
                    <div class="overflow-hidden relative h-32 md:h-48 w-full shrink-0">
                        <img src="${menu.image}" class="absolute inset-0 w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-500 opacity-90">
                    </div>
                    <div class="p-3 md:p-4 flex flex-col flex-grow justify-between">
                        <div>
                            <p class="text-[10px] md:text-xs text-gray-400 font-bold uppercase tracking-wider mb-1">${menu.category}</p>
                            <h3 class="font-bold text-sm md:text-base text-white leading-tight">${menu.name}</h3>
                        </div>
                        <div class="flex justify-between items-end mt-3">
                            <p class="text-akekapRed font-extrabold text-sm md:text-lg">Rp ${menu.price.toLocaleString('id-ID')}</p>
                            <button onclick="addToCart(${menu.id})" class="bg-gray-800 hover:bg-akekapRed text-white w-8 h-8 md:w-10 md:h-10 rounded-full flex items-center justify-center transition-colors shrink-0 shadow">
                                <i class="fa-solid fa-plus text-xs"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `}).join('');
        }

        function setCategory(category, element) {
            activeCategory = category;
            const buttons = document.querySelectorAll('.cat-btn');
            buttons.forEach(btn => {
                btn.className = "cat-btn whitespace-nowrap px-5 py-2 rounded-full font-semibold text-sm bg-gray-900 text-gray-300 border border-gray-800 hover:bg-gray-800 transition";
            });
            element.className = "cat-btn whitespace-nowrap px-5 py-2 rounded-full font-semibold text-sm bg-akekapRed text-white shadow-lg shadow-red-900/30 transition";
            
            renderMenus(document.getElementById('search-input').value);
        }

        function filterMenu() {
            const query = document.getElementById('search-input').value;
            renderMenus(query);
        }

        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'bg-gray-900 border border-gray-800 text-white px-4 py-2.5 rounded-full text-sm font-medium shadow-2xl toast-animate flex items-center gap-2';
            toast.innerHTML = `<i class="fa-solid fa-check-circle text-green-400"></i> ${message}`;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-10px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }

        function addToCart(menuId) {
            const menu = menus.find(m => m.id === menuId);
            const existingItem = cart.find(item => item.id === menuId);
            
            if (existingItem) {
                existingItem.qty += 1;
            } else {
                cart.push({ ...menu, qty: 1 });
            }
            updateCartUI();
            showToast(`${menu.name} ditambahkan`);
        }

        function ubahQty(menuId, delta) {
            const itemIndex = cart.findIndex(item => item.id === menuId);
            if (itemIndex > -1) {
                cart[itemIndex].qty += delta;
                if (cart[itemIndex].qty <= 0) {
                    cart.splice(itemIndex, 1);
                }
                updateCartUI();
            }
        }

        function updateCartUI() {
            const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            
            const badge = document.getElementById('cart-count-badge');
            if (totalQty > 0) {
                badge.innerText = totalQty;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }

            document.getElementById('cart-total-text').innerText = 'Rp ' + totalPrice.toLocaleString('id-ID');

            const cartItemsContainer = document.getElementById('cart-items');
            if (cart.length === 0) {
                cartItemsContainer.innerHTML = `
                    <div class="text-center py-8">
                        <div class="bg-gray-900 border border-gray-800 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-3">
                            <i class="fa-solid fa-basket-shopping text-2xl text-gray-600"></i>
                        </div>
                        <p class="text-gray-400 font-medium text-sm">Keranjang masih kosong</p>
                    </div>`;
                document.getElementById('btn-submit').disabled = true;
                document.getElementById('btn-submit').classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                document.getElementById('btn-submit').disabled = false;
                document.getElementById('btn-submit').classList.remove('opacity-50', 'cursor-not-allowed');
                
                cartItemsContainer.innerHTML = cart.map((item) => `
                    <div class="flex justify-between items-center bg-gray-900 p-3 rounded-xl border border-gray-800">
                        <div class="flex items-center gap-3">
                            <img src="${item.image}" class="w-12 h-12 rounded-lg object-cover">
                            <div>
                                <p class="font-bold text-sm text-white">${item.name}</p>
                                <p class="font-bold text-akekapRed text-xs">Rp ${(item.price * item.qty).toLocaleString('id-ID')}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-2 bg-gray-800 border border-gray-700 rounded-lg p-1 shadow-sm shrink-0">
                            <button onclick="ubahQty(${item.id}, -1)" class="w-6 h-6 flex justify-center items-center text-gray-300 hover:text-akekapRed font-bold">-</button>
                            <span class="text-xs font-bold w-4 text-center text-white">${item.qty}</span>
                            <button onclick="ubahQty(${item.id}, 1)" class="w-6 h-6 flex justify-center items-center text-gray-300 hover:text-green-400 font-bold">+</button>
                        </div>
                    </div>
                `).join('');
            }
        }

        function toggleModal(modalId) {
            const modal = document.getElementById(modalId);
            const content = document.getElementById('checkout-content');
            
            if (modal.classList.contains('hidden')) {
                modal.classList.remove('hidden');
                setTimeout(() => {
                    modal.classList.remove('opacity-0');
                    content.classList.remove('translate-y-full');
                }, 10);
            } else {
                modal.classList.add('opacity-0');
                content.classList.add('translate-y-full');
                setTimeout(() => {
                    modal.classList.add('hidden');
                }, 300);
            }
        }

        function toggleTableInput() {
            const type = document.getElementById('order_type').value;
            const tableContainer = document.getElementById('table_input_container');
            if (type === 'Takeaway') {
                tableContainer.classList.add('opacity-50', 'pointer-events-none');
                document.getElementById('table_number').value = '';
            } else {
                tableContainer.classList.remove('opacity-50', 'pointer-events-none');
            }
        }

        async function prosesCheckout(event) {
            event.preventDefault(); 
            if (cart.length === 0) return;

            const btnSubmit = document.getElementById('btn-submit');
            btnSubmit.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Memproses...`;
            btnSubmit.disabled = true;

            const name = document.getElementById('customer_name').value;
            const type = document.getElementById('order_type').value;
            const table = document.getElementById('table_number').value || "-";
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            const { error } = await supabaseClient
                .from('orders')
                .insert([
                    { customer_name: name, order_type: type, table_number: table, order_details: cart, total_price: totalPrice }
                ]);

            if (error) {
                alert("Gagal menyimpan pesanan: " + error.message);
                btnSubmit.innerHTML = `<i class="fa-brands fa-whatsapp text-xl text-white"></i> Pesan & Lanjut WA`;
                btnSubmit.disabled = false;
                return;
            }

            let textWA = `*HALO R.M. AKEKAP!* 🍽️%0A`;
            textWA += `Ada pesanan baru nih!%0A%0A`;
            textWA += `👤 *Nama:* ${name}%0A`;
            textWA += `🥡 *Tipe:* ${type}%0A`;
            if(type === 'Dine-in') textWA += `🪑 *Meja:* ${table}%0A`;
            textWA += `%0A*DETAIL PESANAN:*%0A`;
            
            cart.forEach(item => {
                textWA += `▪️ ${item.qty}x ${item.name} (Rp ${(item.price * item.qty).toLocaleString('id-ID')})%0A`;
            });
            
            textWA += `%0A💳 *TOTAL TAGIHAN: Rp ${totalPrice.toLocaleString('id-ID')}*%0A%0A`;
            textWA += `_Anda Kenyang Kami Puas_`;

            cart = [];
            updateCartUI();
            toggleModal('checkout-modal');
            btnSubmit.innerHTML = `<i class="fa-brands fa-whatsapp text-xl text-white"></i> Pesan & Lanjut WA`;
            btnSubmit.disabled = false;
            document.getElementById('customer_name').value = '';

            window.open(`https://wa.me/${NOMOR_WHATSAPP}?text=${textWA}`, '_blank');
        }

        renderMenus();
        updateCartUI();
    </script>
</body>
</html>
